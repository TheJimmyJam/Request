<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request — R Mark</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
       background: #F0EFE9; color: #1B2B3B; }
.page  { max-width: 960px; margin: 0 auto; padding: 56px 32px; }
.label { font-size: 11px; font-weight: 500; letter-spacing: .1em;
         text-transform: uppercase; color: #aaa; margin-bottom: 20px; }
.section { margin-bottom: 56px; }
.row { display: flex; gap: 20px; flex-wrap: wrap; }
.panel { display: flex; align-items: center; justify-content: center;
         border-radius: 20px; }
.panel.white { background: #ffffff; }
.panel.navy  { background: #1B2B3B; }
.panel.off   { background: #F0EFE9; border: 1px solid rgba(0,0,0,.08); }
</style>
</head>
<body>
<div class="page">

  <!-- Hero: light + dark -->
  <div class="section">
    <div class="label">Primary mark</div>
    <div class="row">

      <!-- Light -->
      <div class="panel white" style="width:300px;height:300px;">
        <svg width="170" height="183" viewBox="0 0 200 215" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="g1" x1="90" y1="110" x2="157" y2="167" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="#1B2B3B"/>
              <stop offset="52%"  stop-color="#006FA8"/>
              <stop offset="100%" stop-color="#00B4D8"/>
            </linearGradient>
          </defs>
          <rect x="28" y="20" width="16" height="165" rx="2" fill="#1B2B3B"/>
          <path d="M 44,20 L 90,20 C 132,20 148,42 148,65 C 148,88 132,110 90,110 L 44,110 Z" fill="#1B2B3B"/>
          <path d="M 44,34 L 87,34 C 120,34 134,50 134,65 C 134,80 120,96 87,96 L 44,96 Z" fill="white"/>
          <path d="M 90,110 C 118,116 148,148 157,167" fill="none" stroke="url(#g1)" stroke-width="15" stroke-linecap="round"/>
          <g transform="translate(157,168)">
            <circle r="13" fill="#00B4D8"/>
            <polygon points="-9,8 9,8 0,26" fill="#00B4D8"/>
            <circle r="5.5" fill="white"/>
          </g>
        </svg>
      </div>

      <!-- Dark -->
      <div class="panel navy" style="width:300px;height:300px;">
        <svg width="170" height="183" viewBox="0 0 200 215" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="g2" x1="90" y1="110" x2="157" y2="167" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="white"/>
              <stop offset="50%"  stop-color="#70D4EC"/>
              <stop offset="100%" stop-color="#00B4D8"/>
            </linearGradient>
          </defs>
          <rect x="28" y="20" width="16" height="165" rx="2" fill="white"/>
          <path d="M 44,20 L 90,20 C 132,20 148,42 148,65 C 148,88 132,110 90,110 L 44,110 Z" fill="white"/>
          <path d="M 44,34 L 87,34 C 120,34 134,50 134,65 C 134,80 120,96 87,96 L 44,96 Z" fill="#1B2B3B"/>
          <path d="M 90,110 C 118,116 148,148 157,167" fill="none" stroke="url(#g2)" stroke-width="15" stroke-linecap="round"/>
          <g transform="translate(157,168)">
            <circle r="13" fill="#00B4D8"/>
            <polygon points="-9,8 9,8 0,26" fill="#00B4D8"/>
            <circle r="5.5" fill="#1B2B3B"/>
          </g>
        </svg>
      </div>

      <!-- Off-white -->
      <div class="panel off" style="width:300px;height:300px;">
        <svg width="170" height="183" viewBox="0 0 200 215" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="g3" x1="90" y1="110" x2="157" y2="167" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="#1B2B3B"/>
              <stop offset="52%"  stop-color="#006FA8"/>
              <stop offset="100%" stop-color="#00B4D8"/>
            </linearGradient>
          </defs>
          <rect x="28" y="20" width="16" height="165" rx="2" fill="#1B2B3B"/>
          <path d="M 44,20 L 90,20 C 132,20 148,42 148,65 C 148,88 132,110 90,110 L 44,110 Z" fill="#1B2B3B"/>
          <path d="M 44,34 L 87,34 C 120,34 134,50 134,65 C 134,80 120,96 87,96 L 44,96 Z" fill="#F0EFE9"/>
          <path d="M 90,110 C 118,116 148,148 157,167" fill="none" stroke="url(#g3)" stroke-width="15" stroke-linecap="round"/>
          <g transform="translate(157,168)">
            <circle r="13" fill="#00B4D8"/>
            <polygon points="-9,8 9,8 0,26" fill="#00B4D8"/>
            <circle r="5.5" fill="#F0EFE9"/>
          </g>
        </svg>
      </div>

    </div>
  </div>

  <!-- Sizes -->
  <div class="section">
    <div class="label">Scale — favicon to hero</div>
    <div class="panel white" style="padding:32px 40px; gap:32px; display:flex; align-items:flex-end; border-radius:16px; flex-wrap:wrap;">
      <svg width="16" height="17" viewBox="0 0 200 215" xmlns="http://www.w3.org/2000/svg">
        <rect x="28" y="20" width="16" height="165" rx="2" fill="#1B2B3B"/>
        <path d="M 44,20 L 90,20 C 132,20 148,42 148,65 C 148,88 132,110 90,110 L 44,110 Z" fill="#1B2B3B"/>
        <path d="M 44,34 L 87,34 C 120,34 134,50 134,65 C 134,80 120,96 87,96 L 44,96 Z" fill="white"/>
        <path d="M 90,110 C 118,116 148,148 157,167" fill="none" stroke="#00B4D8" stroke-width="15" stroke-linecap="round"/>
        <g transform="translate(157,168)"><circle r="13" fill="#00B4D8"/><polygon points="-9,8 9,8 0,26" fill="#00B4D8"/><circle r="5.5" fill="white"/></g>
      </svg>
      <svg width="24" height="26" viewBox="0 0 200 215" xmlns="http://www.w3.org/2000/svg">
        <rect x="28" y="20" width="16" height="165" rx="2" fill="#1B2B3B"/>
        <path d="M 44,20 L 90,20 C 132,20 148,42 148,65 C 148,88 132,110 90,110 L 44,110 Z" fill="#1B2B3B"/>
        <path d="M 44,34 L 87,34 C 120,34 134,50 134,65 C 134,80 120,96 87,96 L 44,96 Z" fill="white"/>
        <path d="M 90,110 C 118,116 148,148 157,167" fill="none" stroke="#00B4D8" stroke-width="15" stroke-linecap="round"/>
        <g transform="translate(157,168)"><circle r="13" fill="#00B4D8"/><polygon points="-9,8 9,8 0,26" fill="#00B4D8"/><circle r="5.5" fill="white"/></g>
      </svg>
      <svg width="40" height="43" viewBox="0 0 200 215" xmlns="http://www.w3.org/2000/svg">
        <rect x="28" y="20" width="16" height="165" rx="2" fill="#1B2B3B"/>
        <path d="M 44,20 L 90,20 C 132,20 148,42 148,65 C 148,88 132,110 90,110 L 44,110 Z" fill="#1B2B3B"/>
        <path d="M 44,34 L 87,34 C 120,34 134,50 134,65 C 134,80 120,96 87,96 L 44,96 Z" fill="white"/>
        <path d="M 90,110 C 118,116 148,148 157,167" fill="none" stroke="#00B4D8" stroke-width="15" stroke-linecap="round"/>
        <g transform="translate(157,168)"><circle r="13" fill="#00B4D8"/><polygon points="-9,8 9,8 0,26" fill="#00B4D8"/><circle r="5.5" fill="white"/></g>
      </svg>
      <svg width="64" height="69" viewBox="0 0 200 215" xmlns="http://www.w3.org/2000/svg">
        <rect x="28" y="20" width="16" height="165" rx="2" fill="#1B2B3B"/>
        <path d="M 44,20 L 90,20 C 132,20 148,42 148,65 C 148,88 132,110 90,110 L 44,110 Z" fill="#1B2B3B"/>
        <path d="M 44,34 L 87,34 C 120,34 134,50 134,65 C 134,80 120,96 87,96 L 44,96 Z" fill="white"/>
        <path d="M 90,110 C 118,116 148,148 157,167" fill="none" stroke="#00B4D8" stroke-width="15" stroke-linecap="round"/>
        <g transform="translate(157,168)"><circle r="13" fill="#00B4D8"/><polygon points="-9,8 9,8 0,26" fill="#00B4D8"/><circle r="5.5" fill="white"/></g>
      </svg>
      <svg width="96" height="103" viewBox="0 0 200 215" xmlns="http://www.w3.org/2000/svg">
        <rect x="28" y="20" width="16" height="165" rx="2" fill="#1B2B3B"/>
        <path d="M 44,20 L 90,20 C 132,20 148,42 148,65 C 148,88 132,110 90,110 L 44,110 Z" fill="#1B2B3B"/>
        <path d="M 44,34 L 87,34 C 120,34 134,50 134,65 C 134,80 120,96 87,96 L 44,96 Z" fill="white"/>
        <path d="M 90,110 C 118,116 148,148 157,167" fill="none" stroke="#00B4D8" stroke-width="15" stroke-linecap="round"/>
        <g transform="translate(157,168)"><circle r="13" fill="#00B4D8"/><polygon points="-9,8 9,8 0,26" fill="#00B4D8"/><circle r="5.5" fill="white"/></g>
      </svg>
      <svg width="128" height="137" viewBox="0 0 200 215" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gS" x1="90" y1="110" x2="157" y2="167" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1B2B3B"/>
            <stop offset="52%" stop-color="#006FA8"/>
            <stop offset="100%" stop-color="#00B4D8"/>
          </linearGradient>
        </defs>
        <rect x="28" y="20" width="16" height="165" rx="2" fill="#1B2B3B"/>
        <path d="M 44,20 L 90,20 C 132,20 148,42 148,65 C 148,88 132,110 90,110 L 44,110 Z" fill="#1B2B3B"/>
        <path d="M 44,34 L 87,34 C 120,34 134,50 134,65 C 134,80 120,96 87,96 L 44,96 Z" fill="white"/>
        <path d="M 90,110 C 118,116 148,148 157,167" fill="none" stroke="url(#gS)" stroke-width="15" stroke-linecap="round"/>
        <g transform="translate(157,168)"><circle r="13" fill="#00B4D8"/><polygon points="-9,8 9,8 0,26" fill="#00B4D8"/><circle r="5.5" fill="white"/></g>
      </svg>
    </div>
  </div>

  <!-- Horizontal lockup -->
  <div class="section">
    <div class="label">Horizontal lockup — R mark + wordmark</div>
    <div class="panel white" style="padding:36px 48px; border-radius:16px; justify-content:flex-start;">
      <svg width="340" height="72" viewBox="0 0 480 215" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gH" x1="90" y1="110" x2="157" y2="167" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1B2B3B"/>
            <stop offset="52%" stop-color="#006FA8"/>
            <stop offset="100%" stop-color="#00B4D8"/>
          </linearGradient>
        </defs>
        <rect x="28" y="20" width="16" height="165" rx="2" fill="#1B2B3B"/>
        <path d="M 44,20 L 90,20 C 132,20 148,42 148,65 C 148,88 132,110 90,110 L 44,110 Z" fill="#1B2B3B"/>
        <path d="M 44,34 L 87,34 C 120,34 134,50 134,65 C 134,80 120,96 87,96 L 44,96 Z" fill="white"/>
        <path d="M 90,110 C 118,116 148,148 157,167" fill="none" stroke="url(#gH)" stroke-width="15" stroke-linecap="round"/>
        <g transform="translate(157,168)"><circle r="13" fill="#00B4D8"/><polygon points="-9,8 9,8 0,26" fill="#00B4D8"/><circle r="5.5" fill="white"/></g>
        <!-- "equest" wordmark next to the mark -->
        <text x="185" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
              font-weight="700" font-size="88" fill="#1B2B3B" letter-spacing="-1">equest</text>
      </svg>
    </div>
  </div>

  <!-- Color palette -->
  <div class="section">
    <div class="label">Brand colors</div>
    <div style="display:flex; gap:16px; flex-wrap:wrap;">
      <div style="text-align:center">
        <div style="width:72px;height:72px;border-radius:12px;background:#1B2B3B;margin-bottom:8px;"></div>
        <div style="font-size:11px;color:#888;font-weight:500;">Deep navy</div>
        <div style="font-size:11px;color:#bbb;">#1B2B3B</div>
      </div>
      <div style="text-align:center">
        <div style="width:72px;height:72px;border-radius:12px;background:linear-gradient(135deg,#006FA8,#00B4D8);margin-bottom:8px;"></div>
        <div style="font-size:11px;color:#888;font-weight:500;">Electric teal</div>
        <div style="font-size:11px;color:#bbb;">#00B4D8</div>
      </div>
      <div style="text-align:center">
        <div style="width:72px;height:72px;border-radius:12px;background:#F0EFE9;border:1px solid #ddd;margin-bottom:8px;"></div>
        <div style="font-size:11px;color:#888;font-weight:500;">Off-white</div>
        <div style="font-size:11px;color:#bbb;">#F0EFE9</div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
