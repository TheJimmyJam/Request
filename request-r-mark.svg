<svg width="200" height="215" viewBox="0 0 200 215" xmlns="http://www.w3.org/2000/svg">
  <title>Request</title>
  <defs>
    <linearGradient id="lG" x1="90" y1="110" x2="157" y2="167" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1B2B3B"/>
      <stop offset="52%"  stop-color="#006FA8"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
  </defs>

  <!-- Left vertical stem -->
  <rect x="28" y="20" width="16" height="165" rx="2" fill="#1B2B3B"/>

  <!-- Bowl outer: D-shape, fills the upper-right hump -->
  <path d="M 44,20 L 90,20 C 132,20 148,42 148,65 C 148,88 132,110 90,110 L 44,110 Z"
        fill="#1B2B3B"/>

  <!-- Bowl counter: white knockout creating the open eye of the R -->
  <path d="M 44,34 L 87,34 C 120,34 134,50 134,65 C 134,80 120,96 87,96 L 44,96 Z"
        fill="white"/>

  <!-- Leg: curved travel path, gradient navy → electric teal -->
  <path d="M 90,110 C 118,116 148,148 157,167"
        fill="none" stroke="url(#lG)" stroke-width="15" stroke-linecap="round"/>

  <!-- Location pin at leg terminus -->
  <g transform="translate(157, 168)">
    <circle r="13"             fill="#00B4D8"/>
    <polygon points="-9,8 9,8 0,26" fill="#00B4D8"/>
    <circle r="5.5"            fill="white"/>
  </g>
</svg>
